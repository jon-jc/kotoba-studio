name: Kotoba voice
on:
  pull_request:
    paths: ['python/voice/**', 'python/sdk-runtime/**', 'integrations/**', 'packages/client/modules/**', 'packages/client/ui-settings-models/**', 'packages/client/ui-brand-official/**', 'packages/llm/llm-pi-ai/**', 'packages/preset/agent-presets/**', 'packages/host/directory-picker-native/**', '.gitmodules', '.github/workflows/voice.yml']
  push:
    branches: [master]
    paths: ['python/voice/**', 'python/sdk-runtime/**', 'integrations/**', 'packages/client/modules/**', 'packages/client/ui-settings-models/**', 'packages/client/ui-brand-official/**', 'packages/llm/llm-pi-ai/**', 'packages/preset/agent-presets/**', 'packages/host/directory-picker-native/**', '.gitmodules', '.github/workflows/voice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib:host
      - run: pnpm exec vitest run packages/client/modules/tests/node-half.client.spec.ts packages/preset/agent-presets/tests/discovery.spec.ts packages/preset/agent-presets/tests/composition-inventory.spec.ts packages/host/directory-picker-native/tests/packaged-launch.spec.ts packages/host/directory-picker-native/tests/win32-dialog.spec.ts
      - run: pnpm exec vitest run packages/client/ui-brand-official/tests packages/client/ui-settings-models/tests packages/llm/llm-pi-ai/tests/native-providers.spec.ts scripts/project-doc-site.spec.ts scripts/verify-doc-site-fragments.spec.ts
      - run: pnpm exec vitest run packages/fs/fs-sandbox/tests/fs-sandbox.spec.ts packages/interaction/permission-presets/tests/permission-presets.spec.ts
      - run: pnpm run verify-translation-pairing
  voice-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "python/voice[test]" httpx
      - run: python -m pip install --no-deps -e python/sdk
      - run: python -m pytest python/voice/tests
      - run: python -m kotoba.desktop --smoke
        env:
          QT_QPA_PLATFORM: offscreen
          KOTOBA_SCREENSHOT: kotoba-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-desktop-smoke
          path: kotoba-smoke.png
