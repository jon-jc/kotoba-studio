[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kotoba-harness"
version = "0.6.6"
description = "Japanese and English voice workspace for DeepSeek Harness"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["sherpa-onnx==1.13.8", "httpx>=0.28,<1", "Pygments==2.21.0", "PySide6==6.11.2", "faster-whisper==1.2.1", "sounddevice==0.5.6", "soundfile==0.14.0", "numpy==2.5.3", "pydantic>=2.12,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
build = ["pyinstaller==6.22.2"]

[project.scripts]
kotoba = "kotoba.workspace:main"
kotoba-evaluate = "kotoba.evaluate:main"
kotoba-bridge = "kotoba.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
